<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SE Lab Login Preview</title><link rel="stylesheet" href="LabWebApp/wwwroot/css/site.css">
</head>
<body>
  <header><nav class="nav"><a href="#">SE Lab</a><a href="#">Login</a></nav></header>
  <main class="container">
    <section class="login-card">
      <p class="eyebrow">Student Portal</p><h1>Sign in</h1>
      <p>Use <strong>student</strong> and <strong>123456</strong>.</p>
      <form id="loginForm">
        <label for="username">Username</label><input id="username" value="student">
        <label for="password">Password</label><input id="password" type="password" value="123456">
        <button id="loginButton" type="submit">Login</button>
      </form>
      <p id="result" class="message success">Login successful</p>
    </section>
  </main>
  <footer>Software Engineering Lab 9 and 10</footer>
</body>
</html>
